<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中医多科随机复习测试站</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211d;
      --muted: #68736d;
      --line: #dce4df;
      --paper: #f7f3ea;
      --panel: #ffffff;
      --accent: #226b56;
      --accent-deep: #154839;
      --accent-2: #a6422b;
      --soft: #edf5ef;
      --wash: #fbfaf6;
      --gold: #b78941;
      --blue: #315f7d;
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, rgba(34,107,86,.12), rgba(247,243,234,0) 280px), var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(23,33,29,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(23,33,29,.03) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,.55), transparent 52%);
    }
    header, .stage, footer {
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      padding-left: clamp(16px, 3vw, 28px);
      padding-right: clamp(16px, 3vw, 28px);
      position: relative;
    }
    header { padding-top: 18px; padding-bottom: 12px; }
    .topline, .tabs, .toolbar, .actions, .answer-head, .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topline { justify-content: space-between; margin-bottom: 16px; }
    .brand { display: inline-flex; align-items: center; gap: 9px; min-width: 0; color: var(--accent-deep); font-weight: 850; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid rgba(34,107,86,.22); border-radius: 8px; background: #fffdf8; color: var(--accent); box-shadow: 0 8px 20px rgba(25,72,58,.08); }
    .badge { flex: 0 0 auto; display: inline-flex; min-height: 30px; align-items: center; padding: 0 10px; border: 1px solid rgba(183,137,65,.38); border-radius: 999px; background: rgba(255,250,238,.86); color: #775323; font-size: 13px; font-weight: 750; }
    h1 { margin: 0; max-width: 790px; font-size: clamp(28px, 5.5vw, 54px); line-height: 1.05; letter-spacing: 0; }
    .sub { max-width: 760px; margin: 12px 0 0; color: var(--muted); line-height: 1.62; font-size: clamp(15px, 2vw, 17px); }
    .tabs { flex-wrap: wrap; margin-top: 18px; }
    button, select, input {
      font: inherit;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }
    button { padding: 0 14px; font-weight: 750; cursor: pointer; }
    button.primary, .tab.active { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }
    button.ghost { background: rgba(255,255,255,.7); }
    button.icon { width: 42px; padding: 0; display: grid; place-items: center; }
    button:disabled { opacity: .55; cursor: default; }
    .tab { min-width: 86px; }
    .stage { padding-top: 10px; padding-bottom: 28px; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
    .quiz, .side, .search-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 46px rgba(36,46,39,.10);
    }
    .quiz { min-height: 560px; padding: clamp(20px, 4vw, 38px); display: flex; flex-direction: column; gap: 20px; position: relative; overflow: hidden; }
    .quiz::before { content: ""; position: absolute; inset: 0 0 auto; height: 5px; background: linear-gradient(90deg, var(--accent), var(--gold), var(--blue)); }
    .toolbar { flex-wrap: wrap; justify-content: space-between; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    select, input { padding: 0 12px; max-width: 100%; }
    .label { color: var(--muted); font-size: 14px; font-weight: 800; }
    .prompt-name { margin: 10px 0 12px; font-size: clamp(42px, 9.5vw, 88px); line-height: 1.05; font-weight: 850; letter-spacing: 0; overflow-wrap: anywhere; }
    .prompt-name.reverse { font-size: clamp(24px, 5vw, 42px); line-height: 1.38; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { display: inline-flex; align-items: center; min-height: 30px; padding: 0 10px; border-radius: 999px; background: var(--soft); color: #315b50; font-size: 13px; font-weight: 750; }
    .answer { min-height: 178px; border: 1px solid var(--line); border-radius: 8px; padding: clamp(16px, 3vw, 24px); background: var(--wash); line-height: 1.55; }
    .answer.hidden { display: flex; align-items: center; color: var(--muted); font-size: 17px; }
    .answer-main { white-space: pre-wrap; font-size: clamp(20px, 3vw, 30px); line-height: 1.45; font-weight: 850; }
    .answer-extra { margin-top: 16px; display: grid; gap: 10px; }
    .field { padding-top: 10px; border-top: 1px dashed #d8ddd6; }
    .field strong { display: block; margin-bottom: 4px; color: var(--accent-deep); font-size: 14px; }
    .field span { white-space: pre-wrap; color: #34413b; line-height: 1.58; }
    .actions { flex-wrap: wrap; gap: 8px; }
    .actions button { flex: 1 1 132px; }
    .side { padding: 16px; display: grid; gap: 16px; }
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .metric { border: 1px solid var(--line); border-radius: 8px; background: var(--wash); padding: 10px; min-width: 0; }
    .metric b { display: block; font-size: 22px; color: var(--accent-deep); }
    .metric span { color: var(--muted); font-size: 12px; }
    .category-list, .results { display: grid; gap: 8px; max-height: 320px; overflow: auto; padding-right: 2px; }
    .cat, .result { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 10px; cursor: pointer; }
    .cat.active { border-color: rgba(34,107,86,.55); background: var(--soft); }
    .cat-row, .result-row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .cat-name, .result-name { font-weight: 800; overflow-wrap: anywhere; }
    .progress { height: 7px; border-radius: 999px; background: #e9eee9; overflow: hidden; margin-top: 8px; }
    .bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--gold)); }
    .search-panel { margin-top: 18px; padding: 16px; }
    .search-row { align-items: stretch; }
    .search-row input { flex: 1 1 auto; min-width: 0; }
    .search-row select { flex: 0 0 126px; }
    .search-note { min-height: 22px; color: var(--muted); font-size: 13px; margin-top: 8px; }
    footer { padding-top: 0; padding-bottom: 24px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .empty { color: var(--muted); line-height: 1.6; padding: 10px 0; }
    @media (max-width: 860px) {
      .stage { grid-template-columns: 1fr; }
      .side { order: -1; }
      .metric-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .topline { align-items: flex-start; }
      .brand-name { display: none; }
      .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .tab { min-width: 0; padding: 0 8px; }
      .toolbar { align-items: stretch; }
      .filters, .filters select { width: 100%; }
      .filters select { flex: 1 1 100%; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; }
      .actions button { min-width: 0; flex: none; }
      .actions button.primary { grid-column: span 2; }
      .search-row { display: grid; grid-template-columns: 1fr 1fr; }
      .search-row input { grid-column: 1 / -1; }
      .search-row select, .search-row button { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topline">
      <div class="brand"><div class="brand-mark">方</div><div class="brand-name">中医多科复习</div></div>
      <div class="badge">公开测试站</div>
    </div>
    <h1>中药、方剂、针灸随机抽背</h1>
    <p class="sub">这是独立测试网站，不影响原来的中药体验版、激活码完整版和后端。资料只来自当前已提供的 Word 与原中药数据，缺失章节不会补写。</p>
    <div class="tabs" id="subjectTabs"></div>
  </header>

  <main class="stage">
    <section class="quiz">
      <div class="toolbar">
        <div class="filters">
          <select id="moduleSelect" aria-label="模块"></select>
          <select id="modeSelect" aria-label="题型">
            <option value="direct">正向测试</option>
            <option value="reverse">反向测试</option>
          </select>
          <select id="poolSelect" aria-label="范围">
            <option value="all">全部</option>
            <option value="review">待加强</option>
            <option value="favorite">收藏</option>
          </select>
        </div>
        <button class="ghost" id="resetFilterBtn" type="button">全部分类</button>
      </div>

      <div>
        <div class="label" id="promptLabel">这题是</div>
        <div class="prompt-name" id="promptName">加载中</div>
        <div class="chips">
          <span class="chip" id="subjectChip">科目</span>
          <span class="chip" id="moduleChip">模块</span>
          <span class="chip" id="categoryChip">分类</span>
        </div>
      </div>

      <div class="answer hidden" id="answerBox">先在心里背，再点“看答案”。</div>

      <div class="actions">
        <button class="primary" id="revealBtn" type="button">看答案</button>
        <button id="knowBtn" type="button">会了</button>
        <button id="againBtn" type="button">再来一遍</button>
        <button id="favoriteBtn" type="button">收藏</button>
        <button class="ghost" id="nextBtn" type="button">随机下一题</button>
      </div>
    </section>

    <aside class="side">
      <div class="metric-grid">
        <div class="metric"><b id="totalCount">0</b><span>当前题量</span></div>
        <div class="metric"><b id="doneCount">0</b><span>已练</span></div>
        <div class="metric"><b id="reviewCount">0</b><span>待加强</span></div>
      </div>
      <div>
        <div class="label">分类 / 章节进度</div>
        <div class="category-list" id="categoryList"></div>
      </div>
    </aside>
  </main>

  <section class="search-panel stage" style="display:block">
    <div class="search-row">
      <input id="searchInput" placeholder="搜索药名、方名、穴位、功用、定位、主穴">
      <select id="searchScope" aria-label="搜索范围">
        <option value="current">当前科目</option>
        <option value="all">全部科目</option>
      </select>
      <button id="searchBtn" type="button">搜索</button>
      <button class="ghost" id="clearSearchBtn" type="button">清空</button>
    </div>
    <div class="search-note" id="searchNote">可搜索当前科目，也可以切换为全部科目。</div>
    <div class="results" id="results"></div>
  </section>

  <footer>
    <div id="sourceSummary"></div>
  </footer>

  <script>
    let items = [];
    let extractionReport = {counts: {}, sources: []};
    const storagePrefix = "tcm-review-test:v1";
    const subjects = ["中药", "方剂", "针灸"];
    let activeSubject = "中药";
    let activeModule = "功效";
    let activeCategory = "";
    let current = null;
    let revealed = false;

    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value || "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
    const stateKey = () => `${storagePrefix}:${activeSubject}:${activeModule}`;
    const loadState = () => {
      const base = {done:0, know:0, review:[], favorite:[], mastered:[]};
      try { return Object.assign(base, JSON.parse(localStorage.getItem(stateKey()) || "{}")); }
      catch { return base; }
    };
    const saveState = (state) => localStorage.setItem(stateKey(), JSON.stringify(state));
    const currentItems = () => items.filter(item => item.subject === activeSubject && item.module === activeModule);
    const filteredItems = () => {
      const state = loadState();
      let pool = currentItems();
      if (activeCategory) pool = pool.filter(item => item.category === activeCategory);
      if ($("poolSelect").value === "review") pool = pool.filter(item => state.review.includes(item.id));
      if ($("poolSelect").value === "favorite") pool = pool.filter(item => state.favorite.includes(item.id));
      return pool;
    };
    const modulesForSubject = (subject) => [...new Set(items.filter(item => item.subject === subject).map(item => item.module))];
    const promptFor = (item) => {
      if ($("modeSelect").value === "reverse") {
        return item.reversePrompt || item.primaryAnswer || item.name;
      }
      return item.name;
    };
    const answerFor = (item) => {
      if ($("modeSelect").value === "reverse") return item.name;
      return item.primaryAnswer || "见附加信息";
    };
    const promptLabelFor = () => $("modeSelect").value === "reverse" ? "根据提示回忆名称" : "这题是";

    const renderSubjectTabs = () => {
      $("subjectTabs").innerHTML = subjects.map(subject => `<button class="tab ${subject === activeSubject ? "active" : ""}" type="button" data-subject="${subject}">${subject}</button>`).join("");
      document.querySelectorAll("[data-subject]").forEach(btn => btn.addEventListener("click", () => {
        activeSubject = btn.dataset.subject;
        activeModule = modulesForSubject(activeSubject)[0] || "";
        activeCategory = "";
        renderAll();
      }));
    };

    const renderModules = () => {
      const modules = modulesForSubject(activeSubject);
      if (!modules.includes(activeModule)) activeModule = modules[0] || "";
      $("moduleSelect").innerHTML = modules.map(module => `<option value="${escapeHtml(module)}">${escapeHtml(module)}</option>`).join("");
      $("moduleSelect").value = activeModule;
    };

    const renderAnswer = () => {
      const box = $("answerBox");
      if (!current || !revealed) {
        box.className = "answer hidden";
        box.textContent = "先在心里背，再点“看答案”。";
        return;
      }
      const extras = Object.entries(current.extra || {}).filter(([key, value]) => value && value !== answerFor(current));
      box.className = "answer";
      box.innerHTML = `<div class="answer-head"><div class="label">${escapeHtml($("modeSelect").value === "reverse" ? "答案" : current.primaryLabel || "答案")}</div></div>
        <div class="answer-main">${escapeHtml(answerFor(current))}</div>
        <div class="answer-extra">${extras.map(([key, value]) => `<div class="field"><strong>${escapeHtml(key)}</strong><span>${escapeHtml(value)}</span></div>`).join("")}</div>`;
    };

    const pick = (preferredId = "") => {
      const pool = filteredItems();
      if (!pool.length) {
        current = null;
        $("promptName").textContent = "暂无题目";
        $("promptLabel").textContent = "当前范围";
        $("subjectChip").textContent = activeSubject;
        $("moduleChip").textContent = activeModule || "未导入";
        $("categoryChip").textContent = activeCategory || "全部分类";
        renderAnswer();
        return;
      }
      current = preferredId ? pool.find(item => item.id === preferredId) || pool[0] : pool[Math.floor(Math.random() * pool.length)];
      revealed = false;
      $("promptLabel").textContent = promptLabelFor();
      $("promptName").textContent = promptFor(current);
      $("promptName").className = $("modeSelect").value === "reverse" ? "prompt-name reverse" : "prompt-name";
      $("subjectChip").textContent = current.subject;
      $("moduleChip").textContent = current.module;
      $("categoryChip").textContent = current.category || "未分类";
      renderAnswer();
      renderStats();
      updateFavoriteButton();
    };

    const mark = (type) => {
      if (!current) return;
      const state = loadState();
      state.done = Number(state.done || 0) + 1;
      if (type === "know") {
        state.know = Number(state.know || 0) + 1;
        state.review = state.review.filter(id => id !== current.id);
        if (!state.mastered.includes(current.id)) state.mastered.push(current.id);
      } else {
        if (!state.review.includes(current.id)) state.review.push(current.id);
      }
      saveState(state);
      pick();
      renderAllButKeepCard();
    };

    const toggleFavorite = () => {
      if (!current) return;
      const state = loadState();
      if (state.favorite.includes(current.id)) state.favorite = state.favorite.filter(id => id !== current.id);
      else state.favorite.push(current.id);
      saveState(state);
      updateFavoriteButton();
      renderStats();
    };

    const updateFavoriteButton = () => {
      const state = loadState();
      $("favoriteBtn").textContent = current && state.favorite.includes(current.id) ? "已收藏" : "收藏";
    };

    const renderStats = () => {
      const state = loadState();
      const all = currentItems();
      $("totalCount").textContent = filteredItems().length;
      $("doneCount").textContent = state.done || 0;
      $("reviewCount").textContent = state.review.length || 0;
      const mastered = new Set(state.mastered || []);
      const categories = [...new Set(all.map(item => item.category || "未分类"))];
      $("categoryList").innerHTML = categories.map(category => {
        const catItems = all.filter(item => (item.category || "未分类") === category);
        const done = catItems.filter(item => mastered.has(item.id)).length;
        const pct = catItems.length ? Math.round(done / catItems.length * 100) : 0;
        return `<div class="cat ${category === activeCategory ? "active" : ""}" data-category="${escapeHtml(category)}"><div class="cat-row"><div class="cat-name">${escapeHtml(category)}</div><div>${done}/${catItems.length}</div></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div></div>`;
      }).join("") || `<div class="empty">当前科目还没有导入内容。</div>`;
      document.querySelectorAll("[data-category]").forEach(node => node.addEventListener("click", () => {
        activeCategory = node.dataset.category === activeCategory ? "" : node.dataset.category;
        pick();
        renderStats();
      }));
    };

    const search = () => {
      const q = $("searchInput").value.trim().toLowerCase();
      if (!q) {
        $("searchNote").textContent = "请输入关键词。";
        $("results").innerHTML = "";
        return;
      }
      const scope = $("searchScope").value;
      const base = scope === "all" ? items : items.filter(item => item.subject === activeSubject);
      const hits = base.filter(item => JSON.stringify(item).toLowerCase().includes(q)).slice(0, 50);
      const scopeText = scope === "all" ? "全部科目" : activeSubject;
      $("searchNote").textContent = hits.length ? `${scopeText}找到 ${hits.length} 条结果，点击可切换到对应卡片。` : `${scopeText}没有找到结果。`;
      $("results").innerHTML = hits.map(item => `<div class="result" data-result="${item.id}"><div class="result-row"><div class="result-name">${escapeHtml(item.name)}</div><div class="chip">${escapeHtml(item.subject)} / ${escapeHtml(item.module)}</div></div><div class="label">${escapeHtml(item.category || "")}</div></div>`).join("");
      document.querySelectorAll("[data-result]").forEach(node => node.addEventListener("click", () => {
        const item = items.find(entry => entry.id === node.dataset.result);
        if (!item) return;
        activeSubject = item.subject;
        activeModule = item.module;
        activeCategory = "";
        $("poolSelect").value = "all";
        renderSubjectTabs();
        renderModules();
        pick(item.id);
        renderStats();
        window.scrollTo({top: 0, behavior: "smooth"});
      }));
    };

    const clearSearch = () => {
      $("searchInput").value = "";
      $("results").innerHTML = "";
      $("searchNote").textContent = "可搜索当前科目，也可以切换为全部科目。";
    };

    const renderSourceSummary = () => {
      $("sourceSummary").textContent = `数据概况：中药 ${extractionReport.counts["中药"] || 0} 条，方剂 ${extractionReport.counts["方剂"] || 0} 条，针灸穴位 ${extractionReport.counts["针灸-穴位"] || 0} 条，针灸病证选穴 ${extractionReport.counts["针灸-病证选穴"] || 0} 条。`;
    };

    const renderAllButKeepCard = () => {
      renderSubjectTabs();
      renderModules();
      renderStats();
      renderSourceSummary();
    };
    const renderAll = () => {
      renderAllButKeepCard();
      pick();
    };

    const loadData = async () => {
      try {
        const [itemsResponse, reportResponse] = await Promise.all([
          fetch("data/review_items.json", {cache: "no-store"}),
          fetch("data/extraction_report.json", {cache: "no-store"}),
        ]);
        if (!itemsResponse.ok) throw new Error("review_items.json 加载失败");
        items = await itemsResponse.json();
        extractionReport = reportResponse.ok ? await reportResponse.json() : {counts: {}, sources: []};
      } catch (error) {
        $("promptName").textContent = "数据加载失败";
        $("promptLabel").textContent = "请刷新重试";
        $("answerBox").className = "answer hidden";
        $("answerBox").textContent = "如果一直失败，可能是网络或 GitHub Pages 资源加载问题。";
        $("sourceSummary").textContent = error.message || "数据加载失败。";
        throw error;
      }
    };

    $("moduleSelect").addEventListener("change", () => { activeModule = $("moduleSelect").value; activeCategory = ""; pick(); renderStats(); });
    $("modeSelect").addEventListener("change", () => pick(current?.id));
    $("poolSelect").addEventListener("change", () => pick());
    $("resetFilterBtn").addEventListener("click", () => { activeCategory = ""; $("poolSelect").value = "all"; pick(); renderStats(); });
    $("revealBtn").addEventListener("click", () => { revealed = true; renderAnswer(); });
    $("knowBtn").addEventListener("click", () => mark("know"));
    $("againBtn").addEventListener("click", () => mark("again"));
    $("favoriteBtn").addEventListener("click", toggleFavorite);
    $("nextBtn").addEventListener("click", () => pick());
    $("searchBtn").addEventListener("click", search);
    $("clearSearchBtn").addEventListener("click", clearSearch);
    $("searchScope").addEventListener("change", () => {
      if ($("searchInput").value.trim()) search();
      else clearSearch();
    });
    $("searchInput").addEventListener("keydown", event => { if (event.key === "Enter") search(); });

    loadData().then(renderAll);
  </script>
</body>
</html>
